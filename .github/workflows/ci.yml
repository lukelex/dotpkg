name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Check shell syntax
        run: |
          set -Eeuo pipefail
          for script in integration/*; do
            case "$script" in
              *.sh|dotfiles-package-stage) bash -n "$script" ;;
            esac
          done
      - name: Run integration tests
        run: |
          set -Eeuo pipefail
          for test in integration/*.test.sh; do bash "$test"; done
      - name: Check whitespace
        run: git diff --check
      - run: go test ./...
      - run: go vet ./...
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Check known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go test -race ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            output="dist/dotpkg-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$output" ./cmd/dotpkg
          done
           (cd dist && sha256sum dotpkg-linux-*) > dist/SHA256SUMS
      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/dotpkg-linux-amd64
            dist/dotpkg-linux-arm64
            dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/dotpkg-linux-amd64
            dist/dotpkg-linux-arm64
            dist/SHA256SUMS
